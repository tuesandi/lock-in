<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Anmelden – Lock In</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .login-card {
      width: 100%;
      max-width: 360px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .login-card h1 { font-size: 1.4rem; text-align: center; }
    .login-card input {
      width: 100%;
      padding: .75rem .9rem;
      background: var(--card-2);
      border: 1px solid var(--border-2);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 1rem;
    }
    .login-card input:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
    .login-card button {
      padding: .75rem;
      background: var(--primary-btn);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    .login-error { color: var(--danger); font-size: .9rem; text-align: center; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" method="post">
      <h1>Lock In</h1>
      {% if error %}<p class="login-error">{{ error }}</p>{% endif %}
      <input type="password" name="password" placeholder="Passwort" autocomplete="current-password" autofocus required>
      <button type="submit">Anmelden</button>
    </form>
  </div>
</body>
</html>
