<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Kalorien scannen</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:   #6366f1;
      --success:   #10b981;
      --danger:    #ef4444;
      --bg:        #f1f5f9;
      --card:      #ffffff;
      --text:      #1e293b;
      --muted:     #64748b;
      --border:    #e2e8f0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 { font-size: 1.1rem; font-weight: 800; color: var(--primary); }
    header a   { font-size: .85rem; color: var(--muted); text-decoration: none; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      gap: 1.25rem;
    }

    /* ── Upload area ── */
    .upload-area {
      width: 100%;
      max-width: 380px;
      aspect-ratio: 4/3;
      background: var(--card);
      border: 2.5px dashed var(--border);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .75rem;
      cursor: pointer;
      transition: border-color .2s;
      overflow: hidden;
      position: relative;
    }

    .upload-area:active { border-color: var(--primary); }
    .upload-area.has-image { border-style: solid; border-color: var(--primary); }

    .upload-area img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 17px;
    }

    .upload-icon { font-size: 3rem; line-height: 1; }
    .upload-hint { font-size: .9rem; color: var(--muted); font-weight: 500; }

    #file-input { display: none; }

    /* ── Buttons ── */
    .btn {
      width: 100%;
      max-width: 380px;
      padding: 1rem;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
    }
    .btn:active { transform: scale(.97); opacity: .85; }
    .btn:disabled { opacity: .4; cursor: default; transform: none; }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-ghost   { background: var(--card); color: var(--muted); border: 1.5px solid var(--border); }

    /* ── Result card ── */
    .result-card {
      width: 100%;
      max-width: 380px;
      background: var(--card);
      border-radius: 20px;
      padding: 1.5rem;
      text-align: center;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
      display: none;
      flex-direction: column;
      gap: 1rem;
    }

    .result-card.visible { display: flex; }

    .kcal-number {
      font-size: 3.5rem;
      font-weight: 900;
      color: var(--primary);
      letter-spacing: -.04em;
      line-height: 1;
    }

    .kcal-label { font-size: .85rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }

    .desc-input {
      width: 100%;
      padding: .65rem .9rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: .95rem;
      outline: none;
      transition: border-color .2s;
      background: var(--bg);
    }

    .desc-input:focus { border-color: var(--primary); }

    .btn-row { display: flex; gap: .75rem; }
    .btn-row .btn { flex: 1; }

    /* ── Spinner ── */
    .spinner-wrap {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: .75rem;
    }

    .spinner-wrap.visible { display: flex; }

    .spinner {
      width: 44px; height: 44px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner-text { font-size: .9rem; color: var(--muted); }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: calc(1.5rem + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(120%);
      background: var(--text);
      color: #fff;
      padding: .75rem 1.5rem;
      border-radius: 99px;
      font-size: .9rem;
      font-weight: 600;
      transition: transform .35s cubic-bezier(.34,1.56,.64,1);
      white-space: nowrap;
      z-index: 999;
    }

    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<header>
  <h1>Kalorien scannen</h1>
  <a href="/">Dashboard</a>
</header>

<main>

  <!-- Upload -->
  <div class="upload-area" id="upload-area">
    <span class="upload-icon">&#128247;</span>
    <span class="upload-hint">Foto aufnehmen oder wählen</span>
    <img id="preview" src="" alt="" style="display:none">
  </div>
  <input type="file" id="file-input" accept="image/*" capture="environment">

  <!-- Analyse-Button -->
  <button class="btn btn-primary" id="analyze-btn" disabled>Kalorien schätzen</button>

  <!-- Spinner -->
  <div class="spinner-wrap" id="spinner">
    <div class="spinner"></div>
    <span class="spinner-text">Claude analysiert das Foto…</span>
  </div>

  <!-- Ergebnis -->
  <div class="result-card" id="result-card">
    <div>
      <div class="kcal-number" id="kcal-value">—</div>
      <div class="kcal-label">kcal geschätzt</div>
    </div>
    <input class="desc-input" id="desc-input" type="text" placeholder="Bezeichnung (z.B. Pizza Margherita)">
    <div class="btn-row">
      <button class="btn btn-ghost" id="cancel-btn">Verwerfen</button>
      <button class="btn btn-success" id="save-btn">Eintragen ✓</button>
    </div>
  </div>

</main>

<div class="toast" id="toast"></div>

<script>
  const uploadArea  = document.getElementById("upload-area");
  const fileInput   = document.getElementById("file-input");
  const preview     = document.getElementById("preview");
  const analyzeBtn  = document.getElementById("analyze-btn");
  const spinner     = document.getElementById("spinner");
  const resultCard  = document.getElementById("result-card");
  const kcalValue   = document.getElementById("kcal-value");
  const descInput   = document.getElementById("desc-input");
  const saveBtn     = document.getElementById("save-btn");
  const cancelBtn   = document.getElementById("cancel-btn");
  const toast       = document.getElementById("toast");

  let currentCalories = null;
  let imageB64 = null;

  // Tap upload area → open file picker
  uploadArea.addEventListener("click", () => fileInput.click());

  fileInput.addEventListener("change", () => {
    const file = fileInput.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (e) => {
      const dataUrl = e.target.result;
      imageB64 = dataUrl.split(",")[1];           // strip data:...;base64,
      preview.src = dataUrl;
      preview.style.display = "block";
      uploadArea.classList.add("has-image");
      uploadArea.querySelector(".upload-icon").style.display = "none";
      uploadArea.querySelector(".upload-hint").style.display = "none";
      analyzeBtn.disabled = false;
      // reset previous result
      hideResult();
    };
    reader.readAsDataURL(file);
  });

  // Analyse
  analyzeBtn.addEventListener("click", async () => {
    if (!imageB64) return;

    analyzeBtn.disabled = true;
    spinner.classList.add("visible");
    hideResult();

    try {
      const res = await fetch("/api/analyze-food", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image: imageB64, media_type: "image/jpeg" }),
      });
      const data = await res.json();

      if (!res.ok) {
        showToast("Fehler: " + (data.error || res.status));
        return;
      }

      currentCalories = data.calories;
      kcalValue.textContent = data.calories;
      resultCard.classList.add("visible");
      descInput.value = "";
      descInput.focus();
    } catch (err) {
      showToast("Netzwerkfehler – ist der Server erreichbar?");
    } finally {
      spinner.classList.remove("visible");
      analyzeBtn.disabled = false;
    }
  });

  // Eintragen
  saveBtn.addEventListener("click", async () => {
    if (currentCalories === null) return;
    saveBtn.disabled = true;

    const description = descInput.value.trim() || "Foto-Analyse";
    const today = new Date().toISOString().split("T")[0];

    try {
      const res = await fetch("/api/calories/entries", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ description, calories: currentCalories, date: today }),
      });

      if (res.ok) {
        showToast("✓ " + currentCalories + " kcal eingetragen");
        resetPage();
      } else {
        const d = await res.json();
        showToast("Fehler: " + (d.error || res.status));
      }
    } catch {
      showToast("Netzwerkfehler");
    } finally {
      saveBtn.disabled = false;
    }
  });

  // Verwerfen
  cancelBtn.addEventListener("click", resetPage);

  function hideResult() {
    resultCard.classList.remove("visible");
    currentCalories = null;
  }

  function resetPage() {
    hideResult();
    preview.style.display = "none";
    preview.src = "";
    uploadArea.classList.remove("has-image");
    uploadArea.querySelector(".upload-icon").style.display = "";
    uploadArea.querySelector(".upload-hint").style.display = "";
    analyzeBtn.disabled = true;
    fileInput.value = "";
    imageB64 = null;
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 3000);
  }
</script>
</body>
</html>
