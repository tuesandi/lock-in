<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Foto analysieren – Lock In</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:     #818cf8;
      --primary-btn: #4f46e5;
      --primary-dim: rgba(99,102,241,.15);
      --success:     #34d399;
      --danger:      #f87171;
      --bg:          #0d0f1a;
      --card:        #141728;
      --card-2:      #1c2038;
      --text:        #e2e8f0;
      --text-dim:    #94a3b8;
      --muted:       #5a6480;
      --border:      #252a45;
      --border-2:    #2e3455;
      --radius:      16px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* ── Header ── */
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 0 1.25rem;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 { font-size: 1.05rem; font-weight: 800; color: var(--primary); }
    header a   { font-size: .8rem; color: var(--text-dim); text-decoration: none; }
    header a:hover { color: var(--text); }

    /* ── Main ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
      gap: 1rem;
    }

    /* ── Upload area ── */
    .upload-area {
      width: 100%;
      max-width: 400px;
      aspect-ratio: 4/3;
      background: var(--card);
      border: 2px dashed var(--border-2);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .75rem;
      cursor: pointer;
      transition: border-color .2s;
      overflow: hidden;
      position: relative;
    }

    .upload-area:hover { border-color: var(--primary); }
    .upload-area.has-image { border-style: solid; border-color: var(--primary); }

    .upload-area img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }

    .upload-icon { font-size: 2.8rem; line-height: 1; }
    .upload-hint { font-size: .88rem; color: var(--muted); font-weight: 500; }
    #file-input  { display: none; }

    /* ── Analyse button ── */
    .btn-analyze-photo {
      width: 100%; max-width: 400px;
      padding: .9rem;
      background: linear-gradient(135deg, var(--primary-btn), #7c3aed);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
    }

    .btn-analyze-photo:active   { transform: scale(.97); }
    .btn-analyze-photo:disabled { opacity: .4; cursor: default; transform: none; }

    /* ── Spinner ── */
    .spinner-wrap {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: .75rem;
    }

    .spinner-wrap.visible { display: flex; }

    .spinner {
      width: 42px; height: 42px;
      border: 4px solid var(--border-2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner-text { font-size: .88rem; color: var(--muted); }

    /* ── Modal Overlay ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.82);
      z-index: 900;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
    }

    @media (min-height: 600px) {
      .modal-overlay { align-items: center; padding: 1rem; }
    }

    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius) var(--radius) 0 0;
      width: 100%;
      max-width: 520px;
      max-height: 90dvh;
      overflow-y: auto;
      padding: 1.4rem 1.3rem 1.8rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    @media (min-height: 600px) {
      .modal { border-radius: var(--radius); }
    }

    .modal-title {
      font-size: 1rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -.02em;
    }

    /* Total calories row */
    .modal-kcal-row {
      display: flex;
      align-items: center;
      gap: .6rem;
    }

    .modal-kcal-input {
      width: 100px;
      padding: .4rem .6rem;
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--primary);
      background: var(--card-2);
      border: 1px solid var(--border-2);
      border-radius: 10px;
      text-align: center;
      outline: none;
      transition: border-color .2s;
    }

    .modal-kcal-input:focus { border-color: var(--primary); }

    .modal-kcal-label {
      font-size: .88rem;
      color: var(--muted);
      font-weight: 600;
    }

    /* Description input */
    .modal-desc-input {
      width: 100%;
      padding: .55rem .75rem;
      background: var(--card-2);
      border: 1px solid var(--border-2);
      border-radius: 10px;
      font-size: .9rem;
      color: var(--text);
      outline: none;
      transition: border-color .2s;
    }

    .modal-desc-input::placeholder { color: var(--muted); }
    .modal-desc-input:focus { border-color: var(--primary); }

    /* Breakdown table */
    .breakdown-wrap {
      overflow-x: auto;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .breakdown-table {
      width: 100%;
      border-collapse: collapse;
      font-size: .8rem;
    }

    .breakdown-table th {
      background: var(--card-2);
      color: var(--muted);
      font-weight: 700;
      text-align: left;
      padding: .45rem .6rem;
      white-space: nowrap;
      border-bottom: 1px solid var(--border);
    }

    .breakdown-table td {
      padding: .42rem .6rem;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    .breakdown-table tr:last-child td { border-bottom: none; }
    .breakdown-table td:first-child    { color: var(--text); white-space: normal; min-width: 120px; }

    .breakdown-table tfoot td {
      font-weight: 700;
      color: var(--primary);
      background: var(--card-2);
      border-top: 1px solid var(--border-2);
      border-bottom: none;
    }

    /* Modal buttons */
    .modal-btns {
      display: flex;
      gap: .7rem;
    }

    .modal-btn {
      flex: 1;
      padding: .82rem;
      border: none;
      border-radius: 12px;
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
    }

    .modal-btn:active   { transform: scale(.97); }
    .modal-btn:disabled { opacity: .4; cursor: default; }

    .modal-btn-cancel { background: var(--card-2); color: var(--muted); border: 1px solid var(--border-2); }
    .modal-btn-save   { background: linear-gradient(135deg, #059669, #0d9488); color: #fff; }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: calc(1.5rem + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(120%);
      background: var(--text);
      color: var(--bg);
      padding: .7rem 1.5rem;
      border-radius: 99px;
      font-size: .88rem;
      font-weight: 700;
      transition: transform .35s cubic-bezier(.34,1.56,.64,1);
      white-space: nowrap;
      z-index: 999;
    }

    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<header>
  <h1>📷 Foto analysieren</h1>
  <a href="/">← Dashboard</a>
</header>

<main>

  <div class="upload-area" id="upload-area">
    <span class="upload-icon">📸</span>
    <span class="upload-hint">Foto aufnehmen oder wählen</span>
    <img id="preview" src="" alt="" style="display:none">
  </div>
  <input type="file" id="file-input" accept="image/*" capture="environment">

  <button class="btn-analyze-photo" id="analyze-btn" disabled>Kalorien & Zutaten analysieren 🔍</button>

  <div class="spinner-wrap" id="spinner">
    <div class="spinner"></div>
    <span class="spinner-text">Claude analysiert das Foto…</span>
  </div>

</main>

<!-- ── Analyse-Modal ── -->
<div class="modal-overlay" id="modal-overlay" style="display:none">
  <div class="modal">
    <div class="modal-title">Analyse-Ergebnis</div>

    <div class="modal-kcal-row">
      <span class="modal-kcal-label">Kalorien gesamt:</span>
      <input type="number" id="modal-kcal" class="modal-kcal-input" min="1">
      <span class="modal-kcal-label">kcal</span>
    </div>

    <input type="text" id="modal-desc" class="modal-desc-input" placeholder="Bezeichnung (z.B. Pasta Bolognese)">

    <div class="breakdown-wrap" id="breakdown-wrap" style="display:none">
      <table class="breakdown-table">
        <thead>
          <tr>
            <th>Zutat</th>
            <th>g</th>
            <th>kcal</th>
            <th>P&nbsp;g</th>
            <th>K&nbsp;g</th>
            <th>F&nbsp;g</th>
          </tr>
        </thead>
        <tbody id="breakdown-body"></tbody>
        <tfoot>
          <tr>
            <td id="foot-name">Gesamt</td>
            <td id="foot-g">—</td>
            <td id="foot-kcal">—</td>
            <td id="foot-p">—</td>
            <td id="foot-k">—</td>
            <td id="foot-f">—</td>
          </tr>
        </tfoot>
      </table>
    </div>

    <div class="modal-btns">
      <button class="modal-btn modal-btn-cancel" id="modal-cancel">Verwerfen</button>
      <button class="modal-btn modal-btn-save" id="modal-save">Eintragen ✓</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const uploadArea  = document.getElementById("upload-area");
  const fileInput   = document.getElementById("file-input");
  const preview     = document.getElementById("preview");
  const analyzeBtn  = document.getElementById("analyze-btn");
  const spinner     = document.getElementById("spinner");
  const modalOverlay = document.getElementById("modal-overlay");
  const modalKcal   = document.getElementById("modal-kcal");
  const modalDesc   = document.getElementById("modal-desc");
  const breakdownWrap = document.getElementById("breakdown-wrap");
  const breakdownBody = document.getElementById("breakdown-body");
  const modalSave   = document.getElementById("modal-save");
  const modalCancel = document.getElementById("modal-cancel");
  const toast       = document.getElementById("toast");

  let imageB64 = null;

  uploadArea.addEventListener("click", () => fileInput.click());

  fileInput.addEventListener("change", () => {
    const file = fileInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const dataUrl = e.target.result;
      imageB64 = dataUrl.split(",")[1];
      preview.src = dataUrl;
      preview.style.display = "block";
      uploadArea.classList.add("has-image");
      uploadArea.querySelector(".upload-icon").style.display = "none";
      uploadArea.querySelector(".upload-hint").style.display = "none";
      analyzeBtn.disabled = false;
      closeModal();
    };
    reader.readAsDataURL(file);
  });

  analyzeBtn.addEventListener("click", async () => {
    if (!imageB64) return;
    analyzeBtn.disabled = true;
    spinner.classList.add("visible");

    try {
      const res = await fetch("/api/analyze-food", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image: imageB64, media_type: "image/jpeg" }),
      });
      const data = await res.json();

      if (!res.ok) {
        showToast("Fehler: " + (data.error || res.status));
        return;
      }

      openModal(data);
    } catch {
      showToast("Netzwerkfehler – ist der Server erreichbar?");
    } finally {
      spinner.classList.remove("visible");
      analyzeBtn.disabled = false;
    }
  });

  function openModal(data) {
    modalKcal.value = data.calories || "";
    modalDesc.value = data.description || "";

    const breakdown = data.breakdown || [];
    if (breakdown.length) {
      breakdownBody.innerHTML = breakdown.map(item => `
        <tr>
          <td>${escHtml(item.ingredient || "–")}</td>
          <td>${item.grams ?? "–"}</td>
          <td>${item.calories ?? "–"}</td>
          <td>${item.protein_g ?? "–"}</td>
          <td>${item.carbs_g ?? "–"}</td>
          <td>${item.fat_g ?? "–"}</td>
        </tr>
      `).join("");

      const sum = (key) => breakdown.reduce((s, x) => s + (Number(x[key]) || 0), 0);
      document.getElementById("foot-g").textContent    = sum("grams").toFixed(0);
      document.getElementById("foot-kcal").textContent = sum("calories").toFixed(0);
      document.getElementById("foot-p").textContent    = sum("protein_g").toFixed(1);
      document.getElementById("foot-k").textContent    = sum("carbs_g").toFixed(1);
      document.getElementById("foot-f").textContent    = sum("fat_g").toFixed(1);
      breakdownWrap.style.display = "block";
    } else {
      breakdownWrap.style.display = "none";
    }

    modalOverlay.style.display = "flex";
    modalDesc.focus();
  }

  function closeModal() {
    modalOverlay.style.display = "none";
  }

  modalCancel.addEventListener("click", closeModal);

  modalSave.addEventListener("click", async () => {
    const calories = parseInt(modalKcal.value, 10);
    const description = modalDesc.value.trim() || "Foto-Analyse";
    if (!calories || calories < 1) { showToast("Bitte Kalorien eingeben."); return; }

    modalSave.disabled = true;
    const today = new Date().toISOString().split("T")[0];

    try {
      const res = await fetch("/api/calories/entries", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ description, calories, date: today }),
      });
      if (res.ok) {
        showToast("✓ " + calories + " kcal eingetragen");
        closeModal();
        resetPage();
      } else {
        const d = await res.json();
        showToast("Fehler: " + (d.error || res.status));
      }
    } catch {
      showToast("Netzwerkfehler");
    } finally {
      modalSave.disabled = false;
    }
  });

  function resetPage() {
    preview.style.display = "none";
    preview.src = "";
    uploadArea.classList.remove("has-image");
    uploadArea.querySelector(".upload-icon").style.display = "";
    uploadArea.querySelector(".upload-hint").style.display = "";
    analyzeBtn.disabled = true;
    fileInput.value = "";
    imageB64 = null;
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 3000);
  }
</script>
</body>
</html>
